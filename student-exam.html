<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#b22222"><title>Student Examination | OOPA Virtual Labs">
<link rel="stylesheet" href="styles/student-exam.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="scripts/exams/backend-config.js"></script><script src="scripts/exams/backend-client.js"></script><script src="scripts/exams/schema.js"></script><script src="scripts/exams/storage.js"></script><script src="scripts/exams/lab-registry.js"></script><script defer src="scripts/exams/student-runtime.js"></script><script defer src="scripts/exams/student-exam-page.js"></script></head>


<body>
    <header class="topbar"><a class="brand" href="main-menu.html"><span class="brand-mark">O</span><span>OOPA <b>VIRTUAL LABS</b></span></a><span class="top-label">STUDENT EXAMINATION</span></header>

    <main class="shell"><section class="hero"><p class="eyebrow">EXAMINATION PORTAL</p><h1>Enter your examination</h1><p>Use the examination ID, your registered name and matric number, and the six-digit access code supplied by your instructor.</p></section>

        <div class="notice" role="note"><strong>Prototype notice</strong><p>This portal stores attempts in this browser only. It is not tamper-proof and does not sync to an instructor’s computer. Do not use it for high-stakes examinations until server-side verification and storage are configured.</p></div>

        <section class="panel" id="entry-panel"><h2>Student verification</h2><form id="identity-form"><label for="exam-code-id">Examination ID</label><input id="exam-code-id" required maxlength="100" autocomplete="off" placeholder="e.g. OOPA-2026-ABC123"><div class="two-col"><div><label for="student-full-name">Full name as registered</label><input id="student-full-name" required maxlength="160" autocomplete="name"></div><div><label for="student-matric-number">Matric number</label><input id="student-matric-number" required maxlength="80" autocomplete="off"></div></div><label for="student-access-code">Six-digit access code</label><input id="student-access-code" required inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" autocomplete="off" placeholder="••••••"><button class="primary" type="submit" id="verify-button">Verify examination details</button><p class="message" id="identity-message" role="status" aria-live="polite"></p></form></section>

        <section class="panel" id="confirm-panel" hidden><p class="eyebrow">VERIFIED</p><h2 id="confirm-title">Examination</h2><div class="summary-grid"><div><span>Exam ID</span><strong id="confirm-code"></strong></div><div><span>Laboratory</span><strong id="confirm-lab"></strong></div><div><span>Duration</span><strong id="confirm-duration"></strong></div><div><span>Attempts used</span><strong id="confirm-attempts"></strong></div></div><div class="instructions" id="confirm-instructions"></div><p class="caution">When you start, the timer begins and your deadline is saved. Refreshing this page does not reset the timer.</p><button class="primary" id="start-button" type="button">Confirm and start examination</button><button class="secondary" id="back-button" type="button">Back</button><p class="message" id="start-message" role="status" aria-live="polite"></p></section>

        <section class="panel workspace" id="workspace-panel" hidden><div class="exam-head"><div><p class="eyebrow" id="workspace-exam-code"></p><h2 id="workspace-title">Examination</h2><p id="workspace-student"></p></div><div class="timer-card"><span>TIME REMAINING</span><strong id="timer">--:--</strong><small id="deadline-label"></small></div></div><div class="notice compact"><strong>Save your work</strong><p>Work in the lab below, then describe your observations or answers in the evidence field. Lab state is not captured automatically in this prototype.</p></div><div class="lab-toolbar"><div><strong id="workspace-lab-name">Laboratory</strong><small id="lab-assessment-note">Manual review required</small></div><a id="open-lab-link" href="#" target="_blank" rel="noopener">Open lab in new tab ↗</a></div><div class="lab-frame-wrap"><iframe id="lab-frame" title="Examination laboratory" sandbox="allow-scripts allow-forms allow-pointer-lock allow-downloads" referrerpolicy="no-referrer"></iframe></div><label for="evidence-text">Answers, observations and practical evidence</label><textarea id="evidence-text" rows="7" maxlength="20000" placeholder="Describe what you did, record measurements, and answer the instructor’s questions. Your draft is saved locally while you type."></textarea><p class="save-status" id="draft-save-status" aria-live="polite">Draft not yet saved</p><div class="submit-row"><p>Submitting ends this attempt. You cannot edit a submitted response.</p><button class="primary danger" id="submit-button" type="button">Submit examination</button></div><p class="message" id="workspace-message" role="status" aria-live="polite"></p></section>

        <section class="panel result-panel" id="result-panel" hidden><div class="result-icon" id="result-icon">✓</div><h2 id="result-title">Submission received</h2><p id="result-description"></p><div class="summary-grid"><div><span>Exam ID</span><strong id="result-exam-code"></strong></div><div><span>Submission ID</span><strong id="result-submission-id"></strong></div><div><span>Submitted at</span><strong id="result-submitted-at"></strong></div><div><span>Status</span><strong id="result-status"></strong></div></div><p class="caution">Keep your submission ID for reference. Your instructor must review this practical submission; no grade is generated automatically.</p><button class="secondary" id="return-button" type="button">Return to entry page</button></section>

        <footer>OOPA Virtual Labs · Local examination prototype</footer>
    </main>
</body>

</html>
